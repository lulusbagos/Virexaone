name: Backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test backend
        run: dotnet test Backend.Tests/Virexaone.FMS.Backend.Tests.csproj --configuration Release
